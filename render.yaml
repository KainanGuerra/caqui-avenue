# Back da Kaki no Render: um container, uma instância só. Sessões, fila e métricas ficam em memória (D6),
# então não pode haver mais de uma instância nem plano que dorme: ao reiniciar, tudo isso zera.
services:
  - type: web
    name: caqui-kaki
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: starter
    numInstances: 1
    healthCheckPath: /api/saude
    autoDeploy: true
    envVars:
      - key: PORT
        value: "3000"
      - key: DADOS_DIR
        value: /dados
      - key: RELOGIO
        value: dados
      - key: LLM_PROVIDER
        value: template
