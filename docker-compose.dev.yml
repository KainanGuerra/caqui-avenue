# Hot reload: docker compose -f docker-compose.yml -f docker-compose.dev.yml up --build
# O projeto é montado do host; salvar um arquivo recarrega o servidor e a tela.
# As dependências ficam na imagem: depois de mudar o package.json rode com --build -V (renova o volume de node_modules).
services:
  kaki:
    build:
      context: .
      target: dev
    image: caqui-kaki:dev
    # O painel e a Kaki rodam como usuário "node" (uid 1000); arquivos criados no host continuam seus.
    read_only: false
    volumes:
      # O projeto inteiro é montado por diretório (arquivos soltos ficam velhos no container quando o editor
      # salva trocando o arquivo, e foi isso que quebrou o tema do Nuxt UI). Por cima dele:
      - .:/app
      - /app/node_modules   # dependências da imagem, não as do host
      - /app/.nuxt          # arquivos gerados do container, separados dos do host
      - /app/.output
      - ./caqui-invest:/app/caqui-invest:ro   # a pasta do case nunca é gravável
      - ./caqui-invest/dados:/dados:ro
    environment:
      # Sem isso o inotify às vezes não enxerga mudanças em volumes de alguns hosts (Docker Desktop, WSL).
      CHOKIDAR_USEPOLLING: ${CHOKIDAR_USEPOLLING:-false}
      NODE_ENV: development
